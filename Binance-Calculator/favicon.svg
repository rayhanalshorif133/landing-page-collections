<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Emerald to Cyan Neon Gradient matching Header & Theme -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="45%" stop-color="#14B8A6" />
      <stop offset="80%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Binance Signature Gold Gradient -->
    <linearGradient id="binanceGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#FCD535" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Emerald Profit Radiant Gradient -->
    <linearGradient id="emeraldProfit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="50%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Radial Glow Behind Logo -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#06B6D4" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow for Center Element -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#10B981" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Deep Crypto Dark Squircle Background -->
  <rect width="64" height="64" rx="16" fill="#0B0F19" />

  <!-- Ambient Light Reflection -->
  <circle cx="32" cy="32" r="22" fill="url(#centerGlow)" />

  <!-- Outer Gradient Border -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Binance Geometric Emblem (Centered at 32,32) -->
  <g transform="translate(10, 10) scale(1.833)">
    <!-- Top & Bottom Diamonds and Side Wings in Binance Gold -->
    <path fill="url(#binanceGold)" d="M16.624 13.92l2.715 2.715-7.34 7.34-7.34-7.34 2.716-2.715 4.624 4.625 4.625-4.625zm0-3.84L19.339 7.365l-7.34-7.34-7.34 7.34 2.716 2.715 4.624-4.625 4.625 4.625zM4.635 12L1.92 9.285 0 11.205l1.92 1.92-1.92 1.92 1.92 1.92 2.715-2.715-1.92-1.92 1.92-1.92zm14.73 0l1.92-1.92 1.92 1.92-1.92 1.92 1.92 1.92-1.92 1.92-2.715-2.715 1.92-1.92-1.92-1.92z" />

    <!-- Center Diamond in Radiant Emerald Profit Green -->
    <path fill="url(#emeraldProfit)" filter="url(#softGlow)" d="M12 8.64l3.36 3.36-3.36 3.36-3.36-3.36L12 8.64z" />
  </g>

  <!-- Live Pulse Dot in Top-Right Corner (Matches Header Live Status) -->
  <circle cx="49" cy="15" r="4.5" fill="#10B981" opacity="0.3" />
  <circle cx="49" cy="15" r="3" fill="#10B981" />
  <circle cx="49" cy="15" r="1.5" fill="#A7F3D0" />
</svg>
