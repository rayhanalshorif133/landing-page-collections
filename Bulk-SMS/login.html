<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - SMS Route BD</title>

  <!-- Exact Fonts from font-demo.png: DM Sans & Manrope -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Manrope:wght@200..800&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="assets/css/style.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"DM Sans"', 'Arial', 'sans-serif'],
            manrope: ['Manrope', '"DM Sans"', 'sans-serif'],
            georgia: ['Georgia', 'serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#f9fafb] text-slate-800 min-h-screen flex items-center justify-center p-4 antialiased selection:bg-blue-100 selection:text-blue-700">

  <div class="w-full max-w-md">
    <!-- Brand Header -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center gap-2.5 mb-3">
        <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white shadow-md shadow-blue-500/20">
          <i data-lucide="radio" class="w-6 h-6"></i>
        </div>
        <div class="text-left">
          <div class="flex items-center gap-1.5 leading-none">
            <span class="font-bold text-xl text-slate-900 tracking-tight">SMS Route</span>
            <span class="bg-blue-600 text-white text-[11px] font-bold px-1.5 py-0.5 rounded leading-tight">BD</span>
          </div>
          <span class="text-[9px] uppercase tracking-widest text-slate-400 font-semibold mt-0.5">CONNECT · ROUTE · DELIVER</span>
        </div>
      </div>
      <h1 class="text-2xl font-serif-title font-bold text-slate-900 mt-2">Sign in to your account</h1>
      <p class="text-xs text-slate-500 mt-1">A little closer to your customers.</p>
    </div>

    <!-- Login Card -->
    <div class="custom-card p-6 sm:p-8 bg-white shadow-lg space-y-5">
      <form onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Email Address</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <i data-lucide="mail" class="w-4 h-4"></i>
            </div>
            <input 
              type="email" 
              id="login-email"
              value="rayhan.b2m.tech@gmail.com" 
              class="w-full pl-10 pr-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none transition-all"
              required
            >
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between mb-1">
            <label class="block text-xs font-semibold text-slate-700">Password</label>
            <a href="#" onclick="showToast('Password reset link sent to your email!', 'success')" class="text-xs text-blue-600 hover:underline">Forgot password?</a>
          </div>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <i data-lucide="lock" class="w-4 h-4"></i>
            </div>
            <input 
              type="password" 
              id="login-password"
              value="••••••••••••" 
              class="w-full pl-10 pr-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none transition-all"
              required
            >
          </div>
        </div>

        <div class="flex items-center justify-between text-xs text-slate-600">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" checked class="rounded text-blue-600 focus:ring-blue-500 border-slate-300">
            <span>Keep me signed in</span>
          </label>
        </div>

        <button 
          type="submit" 
          class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm rounded-xl shadow-md shadow-blue-500/20 transition-all flex items-center justify-center gap-2 active:scale-[0.99]"
        >
          <span>Sign In to Dashboard</span>
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
      </form>

      <div class="text-center pt-2 border-t border-slate-100 text-xs text-slate-500">
        Don't have an account? 
        <a href="redeem-coupon.html" class="text-blue-600 font-semibold hover:underline">Create free account with 50 SMS</a>
      </div>
    </div>

    <!-- Footer Copyright -->
    <p class="text-center text-xs text-slate-400 mt-6">
      © 2026 SMS Route BD · All rights reserved.
    </p>
  </div>

  <script src="assets/js/main.js"></script>
  <script>
    lucide.createIcons();

    function handleLogin(e) {
      e.preventDefault();
      showToast('Signing in...', 'success');
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 500);
    }
  </script>
</body>
</html>
